<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Knowledge → Learning → Infographic — Production Playbook</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-1: #fafafb;
                --bg-2: #f3f4f8;
                --ink-900: #0b0b0f;
                --ink-600: #484b57;
                --ink-500: #6b7280;
                --ink-400: #9ca3af;
                --card-bg: rgba(255, 255, 255, 0.76);
                --card-bg-solid: #ffffff;
                --card-border: rgba(0, 0, 0, 0.07);
                --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
                --accent-1: #6366f1;
                --accent-2: #8b5cf6;
                --accent-grad: linear-gradient(
                    135deg,
                    var(--accent-1),
                    var(--accent-2)
                );
                --accent-tint: rgba(99, 102, 241, 0.08);
                --accent-tint-strong: rgba(99, 102, 241, 0.14);
                --layer-blue: #7fa8e0;
                --layer-violet: #a996dd;
                --layer-amber: #d9a857;
                --layer-teal: #5fb8aa;
                --fail: #d97878;
                --pass: #5fae82;
                --radius-lg: 22px;
                --radius-sm: 13px;
                --mono: "JetBrains Mono", monospace;
                --sans:
                    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                    sans-serif;
                --sidebar-w: 284px;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                font-family: var(--sans);
                color: var(--ink-900);
                background: var(--bg-1);
                background-image: linear-gradient(
                    160deg,
                    var(--bg-1) 0%,
                    var(--bg-2) 100%
                );
                background-attachment: fixed;
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
            }
            svg text {
                font-family: var(--sans);
            }
            button {
                font-family: inherit;
            }
            ::selection {
                background: var(--accent-tint-strong);
            }

            /* progress */
            #progress {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: rgba(0, 0, 0, 0.04);
                z-index: 60;
            }
            #progress .fill {
                height: 100%;
                width: 0%;
                background: var(--accent-grad);
                transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }

            /* sidebar */
            #sidebar {
                position: fixed;
                top: 3px;
                bottom: 0;
                left: 0;
                width: var(--sidebar-w);
                background: rgba(255, 255, 255, 0.62);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-right: 1px solid var(--card-border);
                overflow-y: auto;
                padding: 26px 14px 40px;
                z-index: 50;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #sidebar::-webkit-scrollbar {
                width: 6px;
            }
            #sidebar::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.12);
                border-radius: 3px;
            }
            .brand {
                padding: 6px 12px 20px;
            }
            .brand .mark {
                width: 30px;
                height: 30px;
                border-radius: 9px;
                background: var(--accent-grad);
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-weight: 700;
                font-size: 13px;
                margin-bottom: 10px;
            }
            .brand h1 {
                font-size: 14.5px;
                font-weight: 700;
                margin: 0 0 3px;
                letter-spacing: -0.01em;
                line-height: 1.3;
            }
            .brand p {
                font-size: 12px;
                color: var(--ink-400);
                margin: 0;
            }
            .nav-group {
                margin-bottom: 6px;
            }
            .nav-group-label {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.09em;
                color: var(--ink-400);
                text-transform: uppercase;
                padding: 16px 12px 6px;
            }
            .nav-item {
                display: flex;
                align-items: center;
                gap: 9px;
                width: 100%;
                text-align: left;
                padding: 8px 12px 8px 10px;
                border: none;
                background: transparent;
                border-radius: 10px;
                cursor: pointer;
                color: var(--ink-600);
                font-size: 13px;
                position: relative;
                border-left: 3px solid transparent;
                margin-bottom: 1px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .nav-item .dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--ink-400);
                flex-shrink: 0;
            }
            .nav-item:hover {
                background: rgba(99, 102, 241, 0.06);
                color: var(--ink-900);
            }
            .nav-item.active {
                background: var(--accent-tint);
                color: var(--ink-900);
                font-weight: 600;
                border-left-color: transparent;
                background-image: linear-gradient(
                    90deg,
                    var(--accent-tint),
                    var(--accent-tint)
                );
                position: relative;
            }
            .nav-item.active {
                border-left: 3px solid;
                border-image: var(--accent-grad) 1;
            }
            .nav-item.active .dot {
                background: var(--accent-1);
            }

            #sidebar-backdrop {
                display: none;
            }

            /* stage */
            #stage-wrap {
                margin-left: var(--sidebar-w);
                min-height: 100vh;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: clamp(48px, 7vh, 96px) 56px 120px;
                position: relative;
            }
            .slide-card {
                max-width: 1040px;
                width: 100%;
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--card-border);
                box-shadow: var(--card-shadow);
                border-radius: var(--radius-lg);
                padding: 52px 60px 48px;
                animation: slideIn 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            }
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateX(20px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation-duration: 0.001ms !important;
                    transition-duration: 0.001ms !important;
                }
            }

            .eyebrow {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 12.5px;
                font-weight: 700;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--accent-1);
            }
            .icon-badge {
                width: 26px;
                height: 26px;
                border-radius: 8px;
                background: var(--accent-tint);
                color: var(--accent-1);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .icon-badge svg {
                width: 15px;
                height: 15px;
            }
            .slide-title {
                font-size: 34px;
                font-weight: 750;
                letter-spacing: -0.02em;
                margin: 14px 0 10px;
                line-height: 1.15;
            }
            .slide-lead {
                font-size: 16px;
                line-height: 1.65;
                color: var(--ink-500);
                max-width: 660px;
                margin: 0;
            }

            .io-row {
                display: flex;
                gap: 10px;
                margin: 26px 0 4px;
                flex-wrap: wrap;
            }
            .io-chip {
                flex: 1;
                min-width: 160px;
                background: rgba(99, 102, 241, 0.045);
                border: 1px solid rgba(99, 102, 241, 0.14);
                border-radius: var(--radius-sm);
                padding: 11px 15px;
            }
            .io-chip.muted {
                background: rgba(0, 0, 0, 0.02);
                border-color: var(--card-border);
            }
            .io-chip .k {
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-400);
                margin-bottom: 3px;
            }
            .io-chip .v {
                font-size: 13.5px;
                font-weight: 600;
                color: var(--ink-900);
                line-height: 1.4;
            }
            .io-arrow {
                align-self: center;
                color: var(--ink-400);
                font-size: 15px;
                padding: 0 2px;
                flex-shrink: 0;
            }

            .diagram-wrap {
                margin: 26px 0 6px;
                background: rgba(0, 0, 0, 0.014);
                border: 1px solid var(--card-border);
                border-radius: var(--radius-sm);
                padding: 22px;
                overflow-x: auto;
            }
            .diagram-wrap.tall {
                max-height: 420px;
                overflow-y: auto;
            }
            .diagram-wrap svg {
                display: block;
                margin: 0 auto;
                max-width: 100%;
                height: auto;
            }

            .note-box {
                margin: 18px 0 4px;
                padding: 14px 18px;
                border-left: 3px solid var(--accent-1);
                background: rgba(99, 102, 241, 0.045);
                border-radius: 0 10px 10px 0;
                font-size: 13.5px;
                color: var(--ink-600);
                line-height: 1.6;
            }
            .note-box em {
                font-style: italic;
                color: var(--ink-900);
            }

            .prompt-block {
                margin-top: 26px;
                border: 1px solid var(--card-border);
                border-radius: var(--radius-sm);
                overflow: hidden;
                background: rgba(255, 255, 255, 0.5);
            }
            .prompt-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
                gap: 10px;
                flex-wrap: wrap;
            }
            .prompt-bar .label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12.5px;
                font-weight: 600;
                color: var(--ink-500);
            }
            .prompt-bar .label svg {
                width: 14px;
                height: 14px;
                color: var(--ink-400);
            }
            .btn-row {
                display: flex;
                gap: 8px;
            }
            .btn-copy,
            .btn-reveal {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                border-radius: 999px;
                font-size: 12.5px;
                font-weight: 600;
                padding: 7px 14px;
                cursor: pointer;
                border: 1px solid transparent;
                transition: opacity 0.15s;
            }
            .btn-copy {
                background: var(--accent-grad);
                color: #fff;
            }
            .btn-copy:hover {
                opacity: 0.88;
            }
            .btn-copy svg {
                width: 13px;
                height: 13px;
            }
            .btn-reveal {
                background: transparent;
                border-color: var(--card-border);
                color: var(--ink-500);
            }
            .btn-reveal:hover {
                color: var(--ink-900);
                border-color: rgba(0, 0, 0, 0.14);
            }
            .btn-reveal svg {
                width: 11px;
                height: 11px;
                transition: transform 0.2s;
            }
            .btn-reveal.open svg {
                transform: rotate(180deg);
            }
            .code-panel {
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                border-top: 1px solid transparent;
            }
            .code-panel.open {
                max-height: 340px;
                border-top-color: var(--card-border);
            }
            .code-inner {
                position: relative;
                background: #0c0c10;
            }
            .code-inner pre {
                margin: 0;
                padding: 20px 44px 20px 20px;
                font-family: var(--mono);
                font-size: 12.5px;
                line-height: 1.65;
                color: #e4e4ec;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 340px;
                overflow-y: auto;
            }
            .code-copy {
                position: absolute;
                top: 10px;
                right: 10px;
                width: 26px;
                height: 26px;
                border-radius: 7px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.12);
                color: #cfcfe0;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .code-copy svg {
                width: 13px;
                height: 13px;
            }
            .code-copy:hover {
                background: rgba(255, 255, 255, 0.16);
            }

            /* worked example block */
            .example-block {
                margin-top: 18px;
                border: 1px solid rgba(217, 168, 87, 0.3);
                border-radius: var(--radius-sm);
                overflow: hidden;
                background: rgba(217, 168, 87, 0.035);
            }
            .example-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
                gap: 10px;
                flex-wrap: wrap;
            }
            .example-bar .label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12.5px;
                font-weight: 600;
                color: #9a6b22;
            }
            .example-bar .label svg {
                width: 14px;
                height: 14px;
                color: #c99a45;
            }
            .example-tag {
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.04em;
                color: #9a6b22;
                background: rgba(217, 168, 87, 0.16);
                border-radius: 999px;
                padding: 3px 10px;
            }
            .btn-example {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                border-radius: 999px;
                font-size: 12.5px;
                font-weight: 600;
                padding: 7px 14px;
                cursor: pointer;
                background: transparent;
                border: 1px solid rgba(217, 168, 87, 0.4);
                color: #9a6b22;
                transition: opacity 0.15s;
            }
            .btn-example:hover {
                opacity: 0.75;
            }
            .btn-example svg {
                width: 11px;
                height: 11px;
                transition: transform 0.2s;
            }
            .btn-example.open svg {
                transform: rotate(180deg);
            }
            .example-panel {
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                border-top: 1px solid transparent;
            }
            .example-panel.open {
                max-height: none;
                border-top-color: rgba(217, 168, 87, 0.25);
            }
            .example-inner {
                padding: 18px 20px 20px;
            }
            .example-quote {
                font-style: italic;
                font-size: 13.5px;
                color: #7a5a22;
                line-height: 1.6;
                margin: 0 0 16px;
                padding-left: 14px;
                border-left: 3px solid rgba(217, 168, 87, 0.55);
            }
            .example-field-label {
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-400);
                margin-bottom: 6px;
            }
            .example-io {
                margin-bottom: 16px;
            }
            .example-io-body {
                position: relative;
                background: #fff;
                border: 1px solid var(--card-border);
                border-radius: 10px;
            }
            .example-io-body pre {
                margin: 0;
                padding: 14px 40px 14px 16px;
                font-family: var(--mono);
                font-size: 12px;
                line-height: 1.6;
                color: var(--ink-600);
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 340px;
                overflow-y: auto;
            }
            .example-io-copy {
                position: absolute;
                top: 8px;
                right: 8px;
                width: 24px;
                height: 24px;
                border-radius: 6px;
                background: rgba(0, 0, 0, 0.04);
                border: 1px solid var(--card-border);
                color: var(--ink-400);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .example-io-copy svg {
                width: 12px;
                height: 12px;
            }
            .example-io-copy:hover {
                background: rgba(0, 0, 0, 0.08);
                color: var(--ink-600);
            }
            .example-footer {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                align-items: center;
                margin-top: 4px;
            }
            .example-save {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                font-weight: 600;
                color: var(--ink-500);
                background: rgba(0, 0, 0, 0.03);
                border: 1px solid var(--card-border);
                border-radius: 999px;
                padding: 6px 12px;
            }
            .example-save svg {
                width: 12px;
                height: 12px;
                color: var(--ink-400);
            }
            .example-gate {
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.02em;
                border-radius: 999px;
                padding: 6px 13px;
            }
            .example-gate.approve {
                background: rgba(99, 102, 241, 0.12);
                color: #4c4fd6;
            }
            .example-gate.revise {
                background: rgba(217, 168, 87, 0.18);
                color: #8a5f1d;
            }
            .example-gate.pass {
                background: rgba(95, 174, 130, 0.16);
                color: #2f7a4f;
            }

            /* diagram element styles (shared by inline HTML diagrams) */
            .tree {
                font-size: 13px;
            }
            .tree ul {
                list-style: none;
                margin: 0;
                padding-left: 22px;
                border-left: 1px dashed rgba(0, 0, 0, 0.14);
            }
            .tree > ul {
                padding-left: 0;
                border-left: none;
            }
            .tree li {
                position: relative;
                padding: 5px 0 5px 18px;
            }
            .tree li::before {
                content: "";
                position: absolute;
                left: 0;
                top: 16px;
                width: 14px;
                height: 1px;
                background: rgba(0, 0, 0, 0.14);
            }
            .tree > ul > li::before {
                display: none;
            }
            .tree .node {
                display: inline-block;
                background: #fff;
                border: 1px solid var(--card-border);
                border-radius: 8px;
                padding: 5px 12px;
                font-weight: 600;
                color: var(--ink-900);
                font-size: 12.5px;
            }
            .tree .node.root {
                background: var(--accent-grad);
                color: #fff;
                border: none;
            }

            .grid-check {
                display: grid;
                gap: 10px;
            }
            .grid-check .item {
                display: flex;
                align-items: center;
                gap: 9px;
                background: #fff;
                border: 1px solid var(--card-border);
                border-radius: 10px;
                padding: 10px 13px;
                font-size: 13px;
                font-weight: 500;
                color: var(--ink-600);
            }
            .grid-check .box {
                width: 15px;
                height: 15px;
                border-radius: 5px;
                border: 1.6px solid var(--accent-1);
                flex-shrink: 0;
            }
            .grid-group-title {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-400);
                margin: 14px 0 8px;
            }
            .grid-group-title:first-child {
                margin-top: 0;
            }

            .dual-cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px;
            }
            .dual-col {
                background: #fff;
                border: 1px solid var(--card-border);
                border-radius: 14px;
                padding: 16px 18px;
            }
            .dual-col h4 {
                margin: 0 0 10px;
                font-size: 13px;
                letter-spacing: 0.03em;
                color: var(--accent-1);
            }
            .dual-col ul {
                margin: 0;
                padding-left: 16px;
            }
            .dual-col li {
                font-size: 12.8px;
                color: var(--ink-600);
                margin-bottom: 6px;
                line-height: 1.5;
            }
            @media (max-width: 640px) {
                .dual-cols {
                    grid-template-columns: 1fr;
                }
            }

            /* footer nav */
            #navbar {
                position: fixed;
                left: var(--sidebar-w);
                right: 0;
                bottom: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 18px;
                padding: 16px;
                pointer-events: none;
                z-index: 45;
            }
            .nav-btn {
                pointer-events: auto;
                width: 42px;
                height: 42px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.72);
                backdrop-filter: blur(14px);
                border: 1px solid var(--card-border);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: var(--ink-600);
                transition:
                    transform 0.15s,
                    color 0.15s;
            }
            .nav-btn:hover {
                color: var(--accent-1);
                transform: translateY(-1px);
            }
            .nav-btn:disabled {
                opacity: 0.3;
                cursor: default;
                pointer-events: none;
            }
            .nav-btn svg {
                width: 17px;
                height: 17px;
            }
            .counter {
                pointer-events: auto;
                background: rgba(255, 255, 255, 0.72);
                backdrop-filter: blur(14px);
                border: 1px solid var(--card-border);
                border-radius: 999px;
                padding: 9px 18px;
                font-size: 12.5px;
                font-weight: 600;
                color: var(--ink-500);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
                letter-spacing: 0.02em;
            }

            /* hamburger (mobile) */
            #hamburger {
                display: none;
                position: fixed;
                top: 14px;
                left: 14px;
                z-index: 70;
                width: 40px;
                height: 40px;
                border-radius: 11px;
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(14px);
                border: 1px solid var(--card-border);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: var(--ink-900);
            }
            #hamburger svg {
                width: 18px;
                height: 18px;
            }

            @media (max-width: 900px) {
                #sidebar {
                    transform: translateX(-100%);
                    width: 78vw;
                    max-width: 320px;

                }

        </style>
    </head>
    <body>
        <div id="progress"><div class="fill" id="progressFill"></div></div>
        <button id="hamburger" aria-label="Open navigation">
            <svg
                viewBox="0 0 24 24"

            >

        </button>
        <div id="sidebar-backdrop"></div>

        <aside id="sidebar">
            <div class="brand">
                <div class="mark">
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                    >
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>

        <div id="stage-wrap">

        <div id="navbar">
            <button class="nav-btn" id="prevBtn" aria-label="Previous slide">
                <svg
                    viewBox="0 0 24 24"

                    stroke-linejoin="round"
                >
                    <path d="M15 18l-6-6 6-6" />

            </button>
            <div class="counter" id="counter">1 / 43</div>
            <button class="nav-btn" id="nextBtn" aria-label="Next slide">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </button>
        </div>

        <script>
            /* ================= ICONS ================= */
            const ICONS = {
                compass:
                    '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2l-2.1 5.5-5.5 2.1 2.1-5.5z"/>',
                target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/>',
                crop: '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
                layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
                network:
                    '<circle cx="12" cy="5" r="2.3"/><circle cx="5" cy="19" r="2.3"/><circle cx="19" cy="19" r="2.3"/><path d="M12 7.3v3.7M12 11L6.5 16.8M12 11l5.5 5.8"/>',
                search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
                filter: '<path d="M4 4h16l-6 8v6l-4 2v-8z"/>',
                book: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17z"/><path d="M20 19H6.5A2.5 2.5 0 0 0 4 21.5"/>',
                zap: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
                image: '<rect x="3" y="3" width="18" height="18" rx="3.2"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="M21 15l-5-5-11 11"/>',
                check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16.3 9"/>',
                refresh:
                    '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',
                flag: '<path d="M5 21V4h14l-3 4 3 4H5"/>',
                list: '<circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/><path d="M9 6h11M9 12h11M9 18h11"/>',
                grid: '<rect x="3" y="3" width="8" height="8" rx="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.6"/>',
                package:
                    '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
                gate: '<path d="M4 21V3M20 21V3M4 7h16M4 17h16"/>',
                loop: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
                clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
                folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
                users: '<circle cx="9" cy="8" r="3.3"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="18" cy="9" r="2.6"/><path d="M15.8 14.2c2.6.5 4.7 2.4 4.7 5.8"/>',
                terminal:
                    '<rect x="3" y="4" width="18" height="16" rx="2.4"/><path d="M7 9l3 3-3 3M12 15h5"/>',
                puzzle: '<path d="M9 3h4v3a2 2 0 0 0 4 0V3h3a2 2 0 0 1 2 2v4h-3a2 2 0 0 0 0 4h3v4a2 2 0 0 1-2 2h-4v-3a2 2 0 0 0-4 0v3H6a2 2 0 0 1-2-2v-4h3a2 2 0 0 0 0-4H4V6a2 2 0 0 1 2-2h3z"/>',
            };
            function iconBadge(key) {
                const p = ICONS[key] || ICONS.compass;
                return `<span class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span>`;
            }
            const CLIP_ICON =
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/></svg>';
            const CHEVRON_ICON =
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
            const CHECKSMALL_ICON =
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

            /* ================= HELPERS ================= */
            function esc(s) {
                return (s + "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }
            function pad2(n) {
                return String(n).padStart(2, "0");
            }

            /* ================= DIAGRAM RENDERERS ================= */
            function buildPipelineNodes(nodes, opts = {}) {
                const compact = !!opts.compact;
                const width = opts.width || 640;
                const nodeH = compact ? 34 : 44;
                const gap = compact ? 24 : 32;
                const cx = width / 2;
                const nw = opts.nodeWidth || (compact ? 320 : 360);
                let inner = `<defs><marker id="arrow${opts.uid || ""}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="rgba(99,102,241,0.45)"/></marker></defs>`;
                let y = 10;
                nodes.forEach((n, i) => {
                    const isObj = typeof n === "object";
                    const label = isObj ? n.text : n;
                    const question = isObj && n.question;
                    const rx = nodeH / 2;
                    const fill = question ? "rgba(217,168,87,0.10)" : "#ffffff";
                    const stroke = question
                        ? "rgba(217,168,87,0.55)"
                        : "rgba(0,0,0,0.09)";
                    const dash = question ? 'stroke-dasharray="4 3"' : "";
                    const fontStyle = question
                        ? "font-style:italic;"
                        : "font-weight:600;";
                    const textColor = question
                        ? "var(--ink-500)"
                        : "var(--ink-900)";
                    inner += `<rect x="${cx - nw / 2}" y="${y}" width="${nw}" height="${nodeH}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="1.3" ${dash}/>`;
                    inner += `<text x="${cx}" y="${y + nodeH / 2 + 4}" text-anchor="middle" font-size="${compact ? 12.5 : 13.5}" style="${fontStyle}" fill="${textColor}">${esc(label)}</text>`;
                    if (i < nodes.length - 1) {
                        const y2 = y + nodeH + gap;
                        inner += `<line x1="${cx}" y1="${y + nodeH}" x2="${cx}" y2="${y2 - 4}" stroke="rgba(99,102,241,0.4)" stroke-width="1.6" marker-end="url(#arrow${opts.uid || ""})"/>`;
                    }
                    y += nodeH + gap;
                });
                return {
                    inner,
                    width,
                    height: y - gap + 12,
                    lastY: y - gap,
                    nodeH,
                    cx,
                };
            }
            function pipelineSVG(nodes, opts = {}) {
                opts.uid = "p" + Math.random().toString(36).slice(2, 7);
                const b = buildPipelineNodes(nodes, opts);
                return `<svg viewBox="0 0 ${b.width} ${b.height}" width="${Math.min(b.width, 640)}">${b.inner}</svg>`;
            }
            function loopSVG(nodes, branch, tail) {
                const opts = {
                    compact: true,
                    uid: "l" + Math.random().toString(36).slice(2, 7),
                    width: 640,
                    nodeWidth: 300,
                };
                const b = buildPipelineNodes(nodes, opts);
                const cx = b.cx;
                let y = b.lastY + 40;
                let inner = b.inner;
                // QA decision pill
                inner += `<rect x="${cx - 70}" y="${y}" width="140" height="34" rx="17" fill="rgba(99,102,241,0.09)" stroke="rgba(99,102,241,0.4)" stroke-width="1.3"/>`;
                inner += `<text x="${cx}" y="${y + 22}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent-1)" style="fill:#6366F1;">QA</text>`;
                const qaBottom = y + 34;
                y = qaBottom + 34;
                const leftX = cx - 150,
                    rightX = cx + 10;
                inner += `<line x1="${cx}" y1="${qaBottom}" x2="${leftX + 70}" y2="${y + 2}" stroke="rgba(217,120,120,0.55)" stroke-width="1.4"/>`;
                inner += `<line x1="${cx}" y1="${qaBottom}" x2="${rightX + 70}" y2="${y + 2}" stroke="rgba(95,174,130,0.55)" stroke-width="1.4"/>`;
                inner += `<text x="${(cx + leftX + 70) / 2 - 14}" y="${y - 6}" font-size="10.5" fill="var(--fail)" style="fill:#D97878;font-weight:700;">FAIL</text>`;
                inner += `<text x="${(cx + rightX + 70) / 2 + 4}" y="${y - 6}" font-size="10.5" fill="var(--pass)" style="fill:#5FAE82;font-weight:700;">PASS</text>`;
                inner += `<rect x="${leftX}" y="${y}" width="140" height="36" rx="18" fill="rgba(217,120,120,0.08)" stroke="rgba(217,120,120,0.45)" stroke-width="1.3"/>`;
                inner += `<text x="${leftX + 70}" y="${y + 23}" text-anchor="middle" font-size="12" style="fill:#B85555;font-weight:600;">↺ Revise</text>`;
                inner += `<rect x="${rightX}" y="${y}" width="140" height="36" rx="18" fill="rgba(95,174,130,0.1)" stroke="rgba(95,174,130,0.5)" stroke-width="1.3"/>`;
                inner += `<text x="${rightX + 70}" y="${y + 23}" text-anchor="middle" font-size="12" style="fill:#3E8A61;font-weight:700;">${esc((branch && branch.pass) || "Approved")}</text>`;
                let bottom = y + 36;
                if (tail) {
                    const ty = bottom + 30;
                    inner += `<line x1="${rightX + 70}" y1="${bottom}" x2="${cx}" y2="${ty - 2}" stroke="rgba(95,174,130,0.5)" stroke-width="1.4" marker-end="url(#arrow${opts.uid})"/>`;
                    inner += `<rect x="${cx - 110}" y="${ty}" width="220" height="38" rx="12" fill="var(--accent-grad)" style="fill:#6366F1;"/>`;
                    inner += `<text x="${cx}" y="${ty + 24}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${esc(tail)}</text>`;
                    bottom = ty + 38;
                }
                return `<svg viewBox="0 0 ${b.width} ${bottom + 12}" width="${Math.min(b.width, 640)}">${inner}</svg>`;
            }
            function layeredSVG(layers) {
                const width = 740,
                    bandH = 76,
                    gap = 5;
                const colorMap = {
                    blue: "127,168,224",
                    violet: "169,150,221",
                    amber: "217,168,87",
                    teal: "95,184,170",
                };
                let inner = "";
                let y = 6;
                layers.forEach((l) => {
                    const rgb = colorMap[l.color] || "99,102,241";
                    inner += `<rect x="0" y="${y}" width="${width}" height="${bandH}" rx="12" fill="rgba(${rgb},0.12)" stroke="rgba(${rgb},0.35)" stroke-width="1.2"/>`;
                    inner += `<rect x="0" y="${y}" width="6" height="${bandH}" rx="3" fill="rgba(${rgb},0.65)"/>`;
                    inner += `<text x="26" y="${y + 30}" font-size="14.5" font-weight="700" fill="var(--ink-900)" style="fill:#0B0B0F;">${esc(l.label)}</text>`;
                    inner += `<text x="26" y="${y + 52}" font-size="12.5" fill="var(--ink-500)" style="fill:#6B7280;">${esc(l.desc)}</text>`;
                    y += bandH + gap;
                });
                return `<svg viewBox="0 0 ${width} ${y + 2}" width="${Math.min(width, 700)}">${inner}</svg>`;
            }
            function hubSpokeSVG(hub, spokes, opts = {}) {
                const width = 740,
                    hubY = 26,
                    hubH = 42,
                    spokeY = 150,
                    spokeH = 40,
                    subY = 222;
                const n = spokes.length;
                const segW = width / n;
                let inner = `<defs><marker id="hs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="rgba(99,102,241,0.4)"/></marker></defs>`;
                const hubW = 220,
                    hubCX = width / 2;
                inner += `<rect x="${hubCX - hubW / 2}" y="${hubY}" width="${hubW}" height="${hubH}" rx="${hubH / 2}" fill="var(--accent-grad)" style="fill:#6366F1;"/>`;
                inner += `<text x="${hubCX}" y="${hubY + hubH / 2 + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${esc(hub)}</text>`;
                spokes.forEach((s, i) => {
                    const scx = segW * i + segW / 2;
                    const sw = Math.min(180, segW - 24);
                    inner += `<path d="M${hubCX} ${hubY + hubH} C ${hubCX} ${(hubY + hubH + spokeY) / 2}, ${scx} ${(hubY + hubH + spokeY) / 2}, ${scx} ${spokeY}" fill="none" stroke="rgba(99,102,241,0.35)" stroke-width="1.5" marker-end="url(#hs-arrow)"/>`;
                    inner += `<rect x="${scx - sw / 2}" y="${spokeY}" width="${sw}" height="${spokeH}" rx="12" fill="#fff" stroke="rgba(0,0,0,0.09)" stroke-width="1.3"/>`;
                    inner += `<text x="${scx}" y="${spokeY + spokeH / 2 + 4.5}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink-900)" style="fill:#0B0B0F;">${esc(s)}</text>`;
                    if (opts.sub) {
                        inner += `<line x1="${scx}" y1="${spokeY + spokeH}" x2="${scx}" y2="${subY - 4}" stroke="rgba(0,0,0,0.16)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
                        inner += `<rect x="${scx - 64}" y="${subY}" width="128" height="30" rx="10" fill="rgba(217,168,87,0.1)" stroke="rgba(217,168,87,0.45)" stroke-width="1.1" stroke-dasharray="4 3"/>`;
                        inner += `<text x="${scx}" y="${subY + 19.5}" text-anchor="middle" font-size="11.5" font-style="italic" fill="var(--ink-500)" style="fill:#6B7280;">${esc(opts.sub)}</text>`;
                    }
                });
                const totalH = opts.sub ? subY + 42 : spokeY + spokeH + 16;
                return `<svg viewBox="0 0 ${width} ${totalH}" width="${Math.min(width, 700)}">${inner}</svg>`;
            }
            function treeHTML(root) {
                function renderNode(n, isRoot) {
                    if (typeof n === "string") {
                        return `<li><span class="node">${esc(n)}</span></li>`;
                    }
                    const label = `<span class="node${isRoot ? " root" : ""}">${esc(n.name)}</span>`;
                    if (!n.children || !n.children.length) {
                        return `<li>${label}</li>`;
                    }
                    return `<li>${label}<ul>${n.children.map((c) => renderNode(c, false)).join("")}</ul></li>`;
                }
                return `<div class="tree"><ul>${renderNode(root, true)}</ul></div>`;
            }
            function checklistHTML(data) {
                const cols = data.cols || 2;
                if (data.groups) {
                    return data.groups
                        .map(
                            (g) => `
      <div class="grid-group-title">${esc(g.title)}</div>
      <div class="grid-check" style="grid-template-columns:repeat(${cols},1fr);margin-bottom:14px;">
        ${g.items.map((it) => `<div class="item"><span class="box"></span>${esc(it)}</div>`).join("")}
      </div>`,
                        )
                        .join("");
                }
                return `<div class="grid-check" style="grid-template-columns:repeat(${cols},1fr);">
    ${data.items.map((it) => `<div class="item"><span class="box"></span>${esc(it)}</div>`).join("")}
  </div>`;
            }
            function dualHTML(data) {
                return `<div class="dual-cols">
    <div class="dual-col"><h4>${esc(data.left.title)}</h4><ul>${data.left.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>
    <div class="dual-col"><h4>${esc(data.right.title)}</h4><ul>${data.right.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>
  </div>`;
            }
            function renderDiagram(d) {
                if (!d) return "";
                switch (d.type) {
                    case "pipeline":
                        return pipelineSVG(d.data.nodes, {
                            compact: d.data.compact,
                        });
                    case "loop":
                        return loopSVG(
                            d.data.nodes,
                            d.data.branch,
                            d.data.tail,
                        );
                    case "layered":
                        return layeredSVG(d.data.layers);
                    case "hubspoke":
                        return hubSpokeSVG(d.data.hub, d.data.spokes, d.data);
                    case "checklist":
                        return checklistHTML(d.data);
                    case "tree":
                        return treeHTML(d.data.root);
                    case "dual":
                        return dualHTML(d.data);
                    default:
                        return "";
                }
            }

            /* ================= CONTENT DATA (43 sections) ================= */
            const SLIDES = [
                /* ---------- FRAMEWORK §1-5 ---------- */
                {
                    group: "framework",
                    num: 1,
                    icon: "compass",
                    title: "System Overview",
                    body: "The workflow separates three concerns that are usually tangled together: knowledge creation, learning design, and visual production. A topic flows step by step from a Learning Mission through knowledge architecture, research, concept design, and infographic production, gated by QA before it becomes a Final Learning System.",
                    diagram: {
                        type: "loop",
                        data: {
                            nodes: [
                                "Learning Mission",
                                "Scope Definition",
                                "Knowledge Architecture",
                                "Hub & Spoke Design",
                                "Research → Extraction → Validation",
                                "Concept Graph + Reconciliation",
                                "Learning Design",
                                "Concept Guide",
                                "Distillation + Recall Model",
                                "Infographic Architecture",
                                "Visual Blueprint",
                                "Prompt Generation",
                                "Visual Render",
                            ],
                            branch: { pass: "PASS" },
                            tail: "Final Learning System",
                        },
                    },
                    example: {
                        insight: `Every phase produces a real artifact — Learning Mission → Scope → Knowledge Architecture → Knowledge Base → Learning Architecture → Concept Guide → Recall Model → Infographic system → QA — rather than one long conversation.`,
                        input: `Topic: AI Agent

Goal: Build a deep conceptual understanding of what an
AI agent is, how it works, its architecture, lifecycle,
tools, memory, planning, and how it differs from a
chatbot/workflow.`,
                        output: `AI-Agent-Learning-System/
├── 00-project/
├── 01-architecture/
├── 02-research/
├── 03-knowledge-base/
├── 04-concept-graph/
├── 05-learning/
├── 06-infographics/
├── 07-visual-production/
├── 08-validation/
└── 09-final/`,
                    },
                },

                {
                    group: "framework",
                    num: 2,
                    icon: "layers",
                    title: "The Core Architecture",
                    body: "The entire system has four layers, each answering a different question — what is true, how a human should understand it, how it should be organized visually, and how it becomes an image. The critical rule governing every phase: a downstream representation must never become the source of truth for upstream knowledge.",
                    diagram: {
                        type: "layered",
                        data: {
                            layers: [
                                {
                                    label: "Layer 1 — Knowledge",
                                    desc: "What is true? What exists? How is it related?",
                                    color: "blue",
                                },
                                {
                                    label: "Layer 2 — Learning",
                                    desc: "How should a human understand and remember it?",
                                    color: "violet",
                                },
                                {
                                    label: "Layer 3 — Visual Information",
                                    desc: "How should the knowledge be organized visually?",
                                    color: "amber",
                                },
                                {
                                    label: "Layer 4 — Rendering",
                                    desc: "How should the approved design become an image?",
                                    color: "teal",
                                },
                            ],
                        },
                    },
                    note: "Canonical flow: Research → Knowledge Base → Learning Model → Infographic Blueprint → Image. Never the reverse — an image that “looks correct” must never become the knowledge itself.",
                },

                {
                    group: "framework",
                    num: 3,
                    icon: "users",
                    title: "The Two AI Roles",
                    body: "The workflow uses two fundamentally different AI roles. The Controller decides what happens next and coordinates the project, but should never casually invent domain knowledge. A Worker performs exactly one specialized task and receives only the context required for it.",
                    diagram: {
                        type: "dual",
                        data: {
                            left: {
                                title: "Controller / Orchestrator decides",
                                items: [
                                    "What phase comes next",
                                    "What information is missing",
                                    "Whether an artifact is ready",
                                    "Whether decomposition is necessary",
                                    "Whether QA passed",
                                    "Whether another iteration is needed",
                                ],
                            },
                            right: {
                                title: "Worker performs one task",
                                items: [
                                    "Research Worker",
                                    "Extraction Worker",
                                    "Architecture Worker",

            /* ================= RENDER ================= */
            const pad = (n) => String(n).padStart(2, "0");
            function eyebrowFor(s) {
                if (s.group === "phase") return `Phase ${pad(s.phase)}`;
                if (s.group === "framework") return `Framework · ${pad(s.num)}`;
                return `Reference · ${pad(s.num)}`;
            }
            function hashFor(s) {
                return s.group === "phase"
                    ? `#phase-${pad(s.phase)}`
                    : `#section-${pad(s.num)}`;
            }
            function sidebarLabel(s) {
                return s.group === "phase"
                    ? `${pad(s.phase)} — ${s.title}`
                    : `${pad(s.num)} ${s.title}`;
            }

            let current = 0;

            function buildSidebar() {
                const list = document.getElementById("navList");
                const groups = [
                    { key: "framework", label: "Framework" },
                    { key: "phase", label: "Production Phases" },
                    { key: "reference", label: "Reference & Playbook" },
                ];
                let html = "";
                groups.forEach((g) => {
                    html += `<div class="nav-group"><div class="nav-group-label">${g.label}</div>`;
                    SLIDES.forEach((s, i) => {
                        if (s.group !== g.key) return;
                        html += `<button class="nav-item" data-i="${i}" title="${esc(s.title)}"><span class="dot"></span>${esc(sidebarLabel(s))}</button>`;
                    });
                    html += `</div>`;
                });
                list.innerHTML = html;
                list.querySelectorAll(".nav-item").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        goTo(parseInt(btn.dataset.i, 10));
                        closeDrawer();
                    });
                });
            }

            function renderIO(io) {
                if (!io) return "";
                const parts = [
                    ["Input", io.input],
                    ["Output", io.output],
                    ["Gate", io.gate],
                ];
                let html = '<div class="io-row">';
                parts.forEach((p, i) => {
                    const muted = p[1] === "—";
                    html += `<div class="io-chip${muted ? " muted" : ""}"><div class="k">${p[0]}</div><div class="v">${esc(p[1])}</div></div>`;
                    if (i < parts.length - 1)
                        html += `<div class="io-arrow">→</div>`;
                });
                html += "</div>";
                return html;
            }

            function renderSlide(i) {
                const s = SLIDES[i];
                const card = document.getElementById("slideCard");

                    }
                    if (ex.gate) {
                        inner += `<span class="example-gate ${gateClass(ex.gate)}">${esc(ex.gate)}</span>`;
                    }
                    inner += `</div>`;
                }
                return `
    <div class="example-block">
      <div class="example-bar">
        <span class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>Worked Example<span class="example-tag">AI Agent</span></span>
        <button class="btn-example" data-example-toggle="${eid}">${CHEVRON_ICON}<span>Show Example</span></button>
      </div>
      <div class="example-panel" id="panel-${eid}">
        <div class="example-inner">${inner}</div>
      </div>
    </div>`;
            }
            function copyText(text, btn) {
                const done = () => {
                    const span = btn.querySelector("span");
                    const original = span ? span.textContent : null;
                    const originalHTML = btn.innerHTML;
                    if (span) {
                        span.textContent = "Copied ✓";
                    } else {
                        btn.innerHTML = CHECKSMALL_ICON;
                    }
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                    }, 1500);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard
                        .writeText(text)
                        .then(done)
                        .catch(() => fallbackCopy(text, done));
                } else {
                    fallbackCopy(text, done);
                }
            }
            function fallbackCopy(text, done) {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                } catch (e) {}
                document.body.removeChild(ta);
                done();
            }

            function updateChrome() {
                document.getElementById("progressFill").style.width =
                    ((current + 1) / SLIDES.length) * 100 + "%";
                document.getElementById("counter").textContent =
                    `${current + 1} / ${SLIDES.length}`;
                document.getElementById("prevBtn").disabled = current === 0;
                document.getElementById("nextBtn").disabled =
                    current === SLIDES.length - 1;
                document.querySelectorAll(".nav-item").forEach((b) => {
                    b.classList.toggle(
                        "active",
                        parseInt(b.dataset.i, 10) === current,
                    );
                });
                const activeEl = document.querySelector(".nav-item.active");
                if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
            }

            let suppressHash = false;
            function goTo(i, opts = {}) {
                if (i < 0 || i >= SLIDES.length) return;
                current = i;
                renderSlide(current);
                updateChrome();
                if (!opts.noHash) {
                    suppressHash = true;
                    location.hash = hashFor(SLIDES[current]);
                    setTimeout(() => {
                        suppressHash = false;
                    }, 0);
                }
            }
            function next() {
                if (current < SLIDES.length - 1) goTo(current + 1);
            }
            function prev() {
                if (current > 0) goTo(current - 1);
            }

            function indexFromHash() {
                const h = location.hash;
                if (!h) return 0;
                const idx = SLIDES.findIndex((s) => hashFor(s) === h);
                return idx >= 0 ? idx : 0;
            }

            /* mobile drawer */
            function openDrawer() {
                document.getElementById("sidebar").classList.add("open");
                document
                    .getElementById("sidebar-backdrop")
                    .classList.add("open");
            }
            function closeDrawer() {
                document.getElementById("sidebar").classList.remove("open");
                document
                    .getElementById("sidebar-backdrop")
                    .classList.remove("open");
            }

            /* init */
            buildSidebar();
            goTo(indexFromHash(), { noHash: true });

            document.getElementById("prevBtn").addEventListener("click", prev);
            document.getElementById("nextBtn").addEventListener("click", next);
            document
                .getElementById("hamburger")
                .addEventListener("click", openDrawer);
            document
                .getElementById("sidebar-backdrop")
                .addEventListener("click", closeDrawer);

            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") next();
                else if (e.key === "ArrowLeft") prev();
                else if (e.key === "Escape") closeDrawer();
            });
            window.addEventListener("hashchange", () => {
                if (suppressHash) return;
                goTo(indexFromHash(), { noHash: true });
            });

            /* swipe */
            let touchX = null,
                touchY = null;
            const stageWrap = document.getElementById("stage-wrap");
            stageWrap.addEventListener(
                "touchstart",
                (e) => {
                    touchX = e.touches[0].clientX;
                    touchY = e.touches[0].clientY;
                },
                { passive: true },
            );
            stageWrap.addEventListener("touchend", (e) => {
                if (touchX === null) return;
                const dx = e.changedTouches[0].clientX - touchX;
                const dy = e.changedTouches[0].clientY - touchY;
                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                    if (dx < 0) next();
                    else prev();
                }
                touchX = null;
                touchY = null;
            });
        </script>
    </body>
</html>
